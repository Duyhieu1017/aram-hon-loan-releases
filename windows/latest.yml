releaseNotes: "- Bấm thông báo sau trận là mở thẳng pha hay nhất, phát từ đúng lúc diễn ra.\n- Trận đã ghi mà không có pha nào vẫn hiện ở màn Clip: xem lại, xoá, hoặc Cắt lại.\n- Tải clip lên ngay sau trận, lịch sử trận cập nhật sau vài giây.\n- Trạng thái bộ ghi rõ hơn: \"Đang tìm cửa sổ game…\" rồi \"Đang ghi cửa sổ League\" hoặc \"Đang ghi toàn màn hình\".\n- Quay thử 5 giây theo đúng cài đặt micro; kết quả báo riêng hình, tiếng game và micro.\n- Thống kê lọc theo chế độ: Hỗn Loạn / ARAM thường / Tất cả. Thẻ lõi chỉ so với các trận Hỗn Loạn.\n- Dùng bàn phím được ở ô chỉ số, bảng tướng, hàng trận và các trang chi tiết.\n- Sửa: bấm Xem clip từ trang tướng/lõi không còn bị trang đó che.\nChưa thử trên máy Windows thật: ghi League (cửa sổ game, tiếng hệ thống) chưa được kiểm tra. Vào Cài đặt → Ghi trận → Quay thử 5 giây để kiểm tra trước khi vào trận."
