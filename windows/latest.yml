releaseNotes: "Cùng số phiên bản với app Mac (0.5.8).\n- Màn Điều khiển có phòng: chấp nhận lời mời, vào phòng mở của bạn bè, mời bạn bè hoặc mời bằng Riot ID, nhường chủ phòng, mời ra khỏi phòng, mở hoặc đóng phòng.\n- Chat trong phòng và điều khiển voice tổ đội (vào, rời, tắt micro, tắt tiếng từng người).\n- Điện thoại Android cũng làm được những việc trên khi ghép với máy này.\nMới: mời, kick và voice nhiều người chưa thử với người chơi thật. Chưa thử trên máy Windows thật: vào Cài đặt → Ghi trận → Quay thử 5 giây để kiểm tra trước khi vào trận."
